# Remplace le cron Vercel (vercel.json) quand le site est hébergé ailleurs :
# appelle chaque jour à 6h UTC (avant le reset de saison à 9h UTC) la route
# qui enregistre l'historique de trophées et la photo de saison.
# Réglages : dépôt GitHub > Settings > Secrets and variables > Actions :
#   SITE_URL    = https://ton-site.onrender.com   (sans slash final)
#   CRON_SECRET = la même valeur que la variable CRON_SECRET du site
# Sans SITE_URL, le workflow ne fait rien.
name: snapshot-cron

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL non défini : rien à faire."
            exit 0
          fi
          # Render gratuit se met en veille : le 1er appel peut prendre ~1 min.
          curl --fail-with-body --retry 3 --retry-delay 60 --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/snapshot"
