# Hébergement de secours gratuit (Render) pendant la pause Vercel.
# Le site tourne tel quel avec `next start` : mêmes variables d'environnement
# que sur Vercel, même base Redis -> aucune donnée perdue, aucun code changé.
services:
  - type: web
    name: purple-corp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BRAWL_STARS_API_KEY
        sync: false
      - key: CLUB_TAGS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
